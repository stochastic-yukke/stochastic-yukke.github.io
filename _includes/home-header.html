<header>
  <h1>
    <a href="{{ "/" | relative_url }}">
      <span class="poetic-line">真砂なす</span>
      <span class="poetic-line">数なき</span>
      <span class="poetic-line">山巓の</span>
    </a>
  </h1>

  <img src="/assets/images/logo.png" id="footer-logo" class="site-logo" alt="Site Logo">

  <p>{{ site.description | default: site.github.project_tagline }}</p>
  
  {% if site.nav %}
  <nav>
      <ul class="home-nav">
          {% for item in site.nav %}
          <li><b><a href="{{ item.url | relative_url }}">{{ item.title }}</a></b></li>
          {% endfor %}
      </ul>
  </nav>
  {% endif %}
</header>
